[package]
name = "minyhost"
version = "0.1.0"
description = "Héberge ton serveur Minecraft sur ton PC, en quelques clics."
authors = ["MariusDev80"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minyhost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
base64 = "0.22"
flate2 = "1"
# Official playit.gg agent (BSD-2-Clause), embedded for Internet access (CLAUDE.md 5.7).
# The crates.io releases lag behind the agent, so they are pinned to a release tag.
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.12" }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.12" }
# Stops the embedded agent (its `CancellationToken`); already used by the agent.
tokio-util = "0.7"
# Tunnel ids stored in instance.json and random claim codes.
uuid = { version = "1", features = ["serde", "v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
